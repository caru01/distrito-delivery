import groovy.json.JsonSlurper
import java.util.Properties

apply plugin: 'com.android.application'

def deliveryEnvironmentsFile = rootProject.file('../config/api-environments.json')
def deliveryEnvironments = new JsonSlurper().parseText(deliveryEnvironmentsFile.getText('UTF-8'))
def productionApiUrl = String.valueOf(deliveryEnvironments.production.apiUrl).replaceAll('/+$', '')
if (productionApiUrl != 'https://api.distritobg.app') {
    throw new GradleException('El Release solo puede utilizar https://api.distritobg.app')
}

def signingPropertiesFile = new File(
        System.getenv('DISTRITO_BG_SIGNING_PROPERTIES')
                ?: new File(System.getProperty('user.home'), '.distritobg/android-release-signing.properties').absolutePath)
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def releaseSigningReady = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
        .every { signingProperties.getProperty(it)?.trim() }

android {
    namespace = "com.distritobg.delivery"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.distritobg.delivery"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "PRODUCTION_API_URL", "\"${productionApiUrl}\""
        manifestPlaceholders = [usesCleartextTraffic: "false"]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartextTraffic: "true"]
            buildConfigField "String", "TRUSTED_WEBVIEW_ORIGIN", '"https://localhost"'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            buildConfigField "String", "TRUSTED_WEBVIEW_ORIGIN", '"https://delivery.distritobg.app"'
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        buildConfig true
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains('release')
    }
    if (releaseRequested && !releaseSigningReady) {
        throw new GradleException("Firma Release ausente. Configure ${signingPropertiesFile.absolutePath}")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
